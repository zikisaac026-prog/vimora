<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIMORA by Thinkilo</title>
<style>
:root{--bg:#07070d;--card:#12121c;--card2:#1a1a28;--line:#272738;--tx:#f3f3fa;--mu:#9a9ab5;--a:#8b5cf6;--b:#06b6d4;--g:linear-gradient(135deg,#8b5cf6,#06b6d4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;background-image:radial-gradient(600px 300px at 50% -50px,#8b5cf633,transparent)}
header{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#07070dcc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.15em;font-size:20px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;text-decoration:none}
.logo small{display:block;letter-spacing:.05em;font-size:10px;font-weight:500;color:var(--mu);-webkit-text-fill-color:var(--mu)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mu);text-decoration:none;padding:9px 10px;border-radius:12px;font-size:13px}
nav a.on{color:var(--tx);background:var(--card2)}
.hide-m{display:none}
@media(min-width:760px){.hide-m{display:flex}.mnav{display:none!important}}
.mnav{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;background:#0c0c14f2;border-top:1px solid var(--line);z-index:9}
.mnav a{flex:1;text-align:center;padding:10px 2px;color:var(--mu);text-decoration:none;font-size:11px}
.mnav a.on{color:var(--tx)}
main{max-width:1000px;margin:auto;padding:20px 16px 110px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:600 14px inherit;cursor:pointer;text-decoration:none}
.btn.p{background:var(--g);border:0;box-shadow:0 8px 30px #8b5cf655}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:38px;padding:0 12px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
h1{font-size:clamp(32px,8vw,56px);line-height:1.08;margin:.3em 0;letter-spacing:-.02em}
h1 span,.grad{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{letter-spacing:-.02em}
.mu{color:var(--mu)}
.hero{text-align:center;padding:24px 0}
textarea{width:100%;min-height:120px;resize:vertical;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:14px;padding:14px;font:16px inherit}
textarea:focus,input:focus,select:focus{outline:2px solid var(--a)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}
.chip{padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mu);font:13px inherit;cursor:pointer;min-height:40px}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.lbl{font-size:12px;color:var(--mu);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:#06b6d422;color:#67e8f9;border:1px solid #06b6d444}
.badge.demo{background:#f59e0b22;color:#fbbf24;border-color:#f59e0b55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.th{aspect-ratio:16/10;border-radius:14px;display:flex;align-items:flex-end;padding:10px;position:relative;overflow:hidden}
.work{display:grid;gap:16px}
@media(min-width:860px){.work{grid-template-columns:1fr 1fr}}
